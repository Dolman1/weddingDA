name: Deploy to GitHub Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          path: site-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site-main/package-lock.json
            site-test/package-lock.json

      - name: Build production
        working-directory: site-main
        env:
          BASE_PATH: /weddingDA/
        run: |
          npm ci
          npm run build

      - name: Build test preview
        working-directory: site-test
        env:
          BASE_PATH: /weddingDA/test/
        run: |
          npm ci
          npm run build

      - name: Combine sites
        run: |
          mkdir -p dist/test
          cp -a site-main/dist/. dist/
          cp -a site-test/dist/. dist/test/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
